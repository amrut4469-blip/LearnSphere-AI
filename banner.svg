<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070716"/>
      <stop offset="0.55" stop-color="#14103a"/>
      <stop offset="1" stop-color="#0b2a4a"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#a5b4fc"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#06b6d4" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="340" rx="24" fill="url(#bg)"/>
  <circle cx="1080" cy="60" r="220" fill="url(#glow1)">
    <animate attributeName="cx" values="1080;1020;1080" dur="9s" repeatCount="indefinite"/>
  </circle>
  <circle cx="160" cy="320" r="200" fill="url(#glow2)">
    <animate attributeName="cy" values="320;270;320" dur="11s" repeatCount="indefinite"/>
  </circle>
  <g fill="#ffffff" opacity="0.55">
    <circle cx="640" cy="40" r="2"><animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="900" cy="290" r="2"><animate attributeName="opacity" values="1;0.2;1" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="1210" cy="180" r="2"><animate attributeName="opacity" values="0.3;1;0.3" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="520" cy="300" r="2"><animate attributeName="opacity" values="1;0.3;1" dur="3.5s" repeatCount="indefinite"/></circle>
  </g>
  <!-- logo -->
  <rect x="80" y="84" width="112" height="112" rx="28" fill="url(#brand)"/>
  <g fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="136" cy="140" r="30"/>
    <path d="M136 110 V170 M106 140 H166 M115 119 L157 161 M157 119 L115 161" opacity="0.9"/>
  </g>
  <text x="224" y="138" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="66" font-weight="800" fill="url(#title)">LearnSphere AI</text>
  <text x="228" y="182" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="28" fill="#c7d2fe">Your syllabus. Your notes. Your preparation.</text>
  <text x="228" y="218" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" fill="#94a3b8">Document-based AI study workspace powered by Google Gemini</text>
  <!-- chips -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#ffffff">
    <rect x="80" y="260" width="176" height="42" rx="21" fill="#8b5cf6" fill-opacity="0.28" stroke="#8b5cf6"/>
    <text x="168" y="287" text-anchor="middle">AI Tutor</text>
    <rect x="272" y="260" width="196" height="42" rx="21" fill="#06b6d4" fill-opacity="0.25" stroke="#06b6d4"/>
    <text x="370" y="287" text-anchor="middle">Voice Learning</text>
    <rect x="484" y="260" width="226" height="42" rx="21" fill="#f59e0b" fill-opacity="0.22" stroke="#f59e0b"/>
    <text x="597" y="287" text-anchor="middle">Gamified Quests</text>
    <rect x="726" y="260" width="226" height="42" rx="21" fill="#22c55e" fill-opacity="0.22" stroke="#22c55e"/>
    <text x="839" y="287" text-anchor="middle">Scan Questions</text>
    <rect x="968" y="260" width="232" height="42" rx="21" fill="#ec4899" fill-opacity="0.22" stroke="#ec4899"/>
    <text x="1084" y="287" text-anchor="middle">Smart Revision</text>
  </g>
</svg>
